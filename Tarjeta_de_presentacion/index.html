<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.18.1/axios.js"></script>
    <link rel="stylesheet" href="styles.css">

    <title>document</title>
</head>

<body>

    <div class="card">

        <div class="imagen">
            <img id="perfil" alt="Foto de perfil">
        </div>

        <div class="informacion">

            <h1>
                <span id="nombre"></span>
                <span id="apellido"></span>
            </h1>

            <div class="datos">

                <p>
                    <strong>Email:</strong><span id="correo"></span>
                </p>

                <p>
                    <strong>Celular:</strong><span id="telefono"></span>
                </p>

                <p>
                    <strong>País:</strong><span id="pais"></span>
                </p>

                <p>
                    <strong>Ciudad:</strong><span id="ciudad"></span>
                </p>

                <p>
                    <strong>Nacionalidad:</strong><span id="nacionalidad"></span>
                </p>

                <p>
                    <strong>Edad:</strong><span id="edad"></span>
                </p>

                <p>
                    <strong>Género:</strong><span id="genero"></span>
                </p>

                <p>
                    <strong>Estado:</strong><span id="estado"></span>
                </p>

                <p>
                    <strong>Código Postal:</strong><span id="codigopostal"></span>
                </p>

                <p>
                    <strong>Fecha de nacimiento:</strong><span id="fechaNacimiento"></span>
                </p>

                <p>
                    <strong>Zona Horaria:</strong><span id="zonahoraria"></span>
                </p>

                <p>
                    <strong>Offset:</strong><span id="offset"></span>
                </p>
            </div>
        </div>
    </div>


    <script src="index.js"></script>

</body>

</html>
